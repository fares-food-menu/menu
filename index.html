<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notre Menu</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    rgba(0, 35, 28, 0.78),
                    rgba(0, 35, 28, 0.88)
                ),
                url("https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            padding: 45px 30px;
            border-radius: 25px;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.25);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .logo {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;

            border-radius: 50%;

            background: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            border: 4px solid #c9a96e;

            box-shadow:
                0 5px 25px rgba(0,0,0,0.3);
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 {
            color: #ffffff;
            font-size: 30px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #d8c18b;
            font-size: 15px;
            margin-bottom: 35px;
        }

        .menu-button {
            display: block;

            width: 100%;
            padding: 18px 20px;

            border-radius: 15px;

            background: linear-gradient(
                135deg,
                #c9a96e,
                #e1c58d
            );

            color: #143b32;

            text-decoration: none;

            font-size: 18px;
            font-weight: bold;

            box-shadow:
                0 8px 20px rgba(0,0,0,0.25);

            transition: all 0.25s ease;
        }

        .menu-button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 30px rgba(0,0,0,0.35);
        }

        .menu-button:active {
            transform: scale(0.98);
        }

        .icon {
            margin-right: 8px;
        }

        .footer {
            margin-top: 30px;
            color: rgba(255,255,255,0.65);
            font-size: 12px;
        }

        @media (max-width: 480px) {

            .container {
                padding: 35px 22px;
            }

            h1 {
                font-size: 26px;
            }

            .logo {
                width: 95px;
                height: 95px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LOGO -->
        <div class="logo">
            <img src="logo.png" alt="Logo">
        </div>

        <!-- TITRE -->
        <h1>Notre Menu</h1>

        <div class="subtitle">
            Découvrez notre carte
        </div>

        <!-- BOUTON MENU -->
        <a
            class="menu-button"
            href="menu.pdf"
            target="_blank"
        >
            <span class="icon">📖</span>
            Voir le menu
        </a>

        <div class="footer">
            Bienvenue et bonne dégustation ✨
        </div>

    </div>

</body>
</html>
